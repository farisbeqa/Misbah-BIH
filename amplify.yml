# AWS Amplify Hosting (Next.js SSR). The server runs with the
# misbah-amplify-compute IAM role (Aurora DSQL + media bucket); the build never
# touches the database. Server-side environment variables have to be written to
# .env.production during the build to reach the SSR runtime.
version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 22 || nvm install 22
        - npm ci
    build:
      commands:
        - env | grep -E '^(SESSION_SECRET|DSQL_|MEDIA_|NEXT_PUBLIC_)' >> .env.production || true
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .next/cache/**/*
      - node_modules/**/*
